name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cssc_hordesurvival

    steps:
      - name: Check out verified game commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: cssc_hordesurvival

      - name: Check out LoudnessMeter
        uses: actions/checkout@v4
        with:
          repository: koto-thing/LoudnessMeter
          ref: c828effc8ccff7f61312fcbe53693aa7c2d30127
          path: LoudnessMeter

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          working-directory: cssc_hordesurvival
          cache: true
          run-install: false

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install LoudnessMeter dependencies
        run: npm ci
        working-directory: LoudnessMeter/packages/loudness-web

      - name: Build LoudnessMeter web package
        run: npm run build
        working-directory: LoudnessMeter/packages/loudness-web

      - name: Install game dependencies
        run: vp install

      - name: Build
        run: vp build

      - name: Deploy to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./cssc_hordesurvival/dist/
          server-dir: /koto-thing-game/cssc_horde_survival/
          dangerous-clean-slate: false
