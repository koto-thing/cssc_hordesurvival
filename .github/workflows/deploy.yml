name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cssc_hordesurvival

    steps:
      - name: Check out verified game commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: cssc_hordesurvival

      - name: Prepare source deployment files
        shell: bash
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          cp index.html _deploy/index.html
          cp -R src _deploy/src

      - name: Deploy to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./cssc_hordesurvival/_deploy/
          server-dir: /koto-thing-game/cssc_horde_survival/
          dangerous-clean-slate: false
