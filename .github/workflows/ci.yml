name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cssc_hordesurvival

    steps:
      # Keep both repositories as siblings to match the local file dependency
      - name: Check out game repository
        uses: actions/checkout@v4
        with:
          path: cssc_hordesurvival

      - name: Check out LoudnessMeter
        uses: actions/checkout@v4
        with:
          repository: koto-thing/LoudnessMeter
          ref: c828effc8ccff7f61312fcbe53693aa7c2d30127
          path: LoudnessMeter

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          working-directory: cssc_hordesurvival
          cache: true
          run-install: false

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install LoudnessMeter dependencies
        run: npm ci
        working-directory: LoudnessMeter/packages/loudness-web

      - name: Build LoudnessMeter web package
        run: npm run build
        working-directory: LoudnessMeter/packages/loudness-web

      - name: Install game dependencies
        run: vp install

      - name: Check lint and types
        run: vp check --no-fmt

      - name: Run tests
        run: vp test

      - name: Build
        run: vp build
